# First target experiment - see docs/EXPERIMENT.md for status (not yet
# run; this config's structure is fixed now, exact hyperparameters may
# still be tuned once real runs start in Phase E).

model:
  name: Qwen/Qwen3-1.7B

algorithm:
  name: grpo

rollout:
  backend: quic-vllm
  workers: 2
  samples_per_prompt: 8   # GRPO group size

reward:
  backend: math

trainer:
  backend: quic-train

synchronization:
  strategy: checkpoint   # export -> transfer -> reload, see docs/ARCHITECTURE.md

dataset:
  # gsm8k_train + math_train, combined via quic_rl.dataset.math_dataset -
  # matches the reference reproduction target's real training_config.yaml
  # (train_dataset_names: [gsm8k_train, math_train]), read directly from
  # that file, not guessed. This field is descriptive only - the real
  # loader is quic_rl.dataset.math_dataset.build_prompt_source(), not a
  # generic load_dataset(config.dataset.name) lookup (see math_grpo.py).
  name: gsm8k_train+math_train
  split: train

evaluation:
  # gsm8k_test + math_500 - matches the reproduction target's own real
  # eval set, not this repo's earlier (wrong) assumption of the
  # AIME/AMC competition benchmarks.
  benchmarks:
    - gsm8k_test
    - math500

max_iterations: 100
state_dir: ./quic_rl_state
