[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quic_rl"
version = "0.1.0"
description = "Orchestration layer between quic-train (distributed LLM training over QUIC) and quic-vllm (distributed inference over QUIC) for online GRPO."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
# quic-train/quic-vllm integration (Phase B/C) - the orchestration core
# above (mock backends, config, metrics, tests) has none of these as a
# hard dependency, deliberately, so `pytest tests/` needs no GPU/model.
real = [
    "torch>=2.0",
    "peft>=0.10",
    "transformers>=4.40",
    "datasets>=2.18",
]
# Opt-in - see MetricsLogger's own docstring (JSONL stays the default,
# W&B is additive). Separate extra from `real` since tracking is a
# choice independent of which backends are wired up.
tracking = ["wandb>=0.16"]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["quic_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
